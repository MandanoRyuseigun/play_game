name: 戦歴一覧を更新

on:
  push:
    paths:
      - 'docs/matches/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: matches.json を作り直す
        run: node tools/update-matches.js
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- docs/matches/matches.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/matches/matches.json
          git commit -m "戦歴一覧を更新"
          git push
