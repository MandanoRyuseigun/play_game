<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サンプル試合（ダミーデータ）</title>
<style>
  :root { --bg:#12132a; --panel:#1c1e3c; --line:#33366a; --fg:#e8e9f7; --sub:#9fa3c9; --crew:#6fd3ff; --imp:#ff6f7d; --room:#262a52; --room-line:#4a4f8c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI","Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; display:grid; gap:16px; grid-template-columns: 300px 1fr; }
  @media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .banner { grid-column: 1 / -1; background:#3a2f12; border-color:#7a6424; color:#ffe7a3; font-size:13px; }
  h1 { font-size:18px; margin:0 0 2px; } .sub { color:var(--sub); font-size:12px; }
  .win { display:inline-block; margin-top:8px; padding:2px 10px; border-radius:99px; background:rgba(111,211,255,.15); color:var(--crew); font-weight:bold; }
  table { width:100%; border-collapse: collapse; margin-top:10px; font-size:13px; }
  td { padding:5px 4px; border-top:1px solid var(--line); vertical-align: middle; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px; border:1px solid rgba(255,255,255,.4); }
  .role-crew { color:var(--crew); } .role-imp { color:var(--imp); }
  .dead { color:var(--sub); text-decoration: line-through; }
  canvas { width:100%; height:auto; display:block; background:#0c0d1f; border-radius:8px; }
  .ctrl { display:flex; gap:10px; align-items:center; margin-top:10px; }
  .ctrl input[type=range] { flex:1; }
  button { font:inherit; background:#353a6b; color:#fff; border:1px solid #6a70b8; border-radius:6px; padding:4px 12px; cursor:pointer; }
  .log { margin-top:10px; font-size:13px; max-height:180px; overflow:auto; }
  .log div { padding:2px 0; color:var(--sub); } .log div.on { color:var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card banner">これは表示確認用のサンプルです。プレイヤー名・マップ・展開はすべて架空のダミーデータで、実際の試合ではありません。</div>
  <div class="card">
    <h1>サンプル試合</h1>
    <div class="sub">ダミーデータ ・ 10人 ・ 約6分</div>
    <div class="win">クルー陣営の勝利</div>
    <table id="players"></table>
  </div>
  <div class="card">
    <canvas id="map" width="900" height="560"></canvas>
    <div class="ctrl">
      <button id="play">▶ 再生</button>
      <input id="t" type="range" min="0" max="360" value="0">
      <span id="time" class="sub">0:00</span>
    </div>
    <div class="log" id="log"></div>
  </div>
</div>
<script>
(function () {
  // ---- ダミーデータ ----
  var rooms = [
    { n: '北ホール', x: 330, y: 30, w: 240, h: 120 },
    { n: '倉庫', x: 40, y: 60, w: 180, h: 140 },
    { n: '研究室', x: 680, y: 60, w: 180, h: 140 },
    { n: '中央通路', x: 330, y: 220, w: 240, h: 110 },
    { n: '機関室', x: 40, y: 330, w: 200, h: 170 },
    { n: '通信室', x: 660, y: 340, w: 200, h: 160 },
    { n: '南デッキ', x: 330, y: 410, w: 240, h: 120 }
  ];
  var halls = [[0, 3], [1, 3], [2, 3], [3, 6], [4, 6], [5, 6], [1, 4], [2, 5]];
  var players = [
    { n: 'プレイヤーA', c: '#e5484d', r: 'imp' }, { n: 'プレイヤーB', c: '#3e63dd', r: 'crew' },
    { n: 'プレイヤーC', c: '#30a46c', r: 'crew' }, { n: 'プレイヤーD', c: '#f5d90a', r: 'crew' },
    { n: 'プレイヤーE', c: '#f76b15', r: 'imp' }, { n: 'プレイヤーF', c: '#e93d82', r: 'crew' },
    { n: 'プレイヤーG', c: '#8e4ec6', r: 'crew' }, { n: 'プレイヤーH', c: '#12a594', r: 'crew' },
    { n: 'プレイヤーI', c: '#f0f0f0', r: 'crew' }, { n: 'プレイヤーJ', c: '#8d8d8d', r: 'crew' }
  ];
  var events = [
    { t: 0, s: '試合開始' },
    { t: 74, s: 'プレイヤーHが倉庫で倒される', kill: 7 },
    { t: 95, s: 'プレイヤーCが通報 → 会議（追放なし）' },
    { t: 160, s: 'プレイヤーJが通信室で倒される', kill: 9 },
    { t: 182, s: '会議 → プレイヤーEが追放される', kill: 4 },
    { t: 268, s: 'プレイヤーGが機関室で倒される', kill: 6 },
    { t: 290, s: '会議 → プレイヤーAが追放される', kill: 0 },
    { t: 300, s: 'クルー陣営の勝利' }
  ];
  // 各プレイヤーの経路（部屋番号の並び）を擬似乱数で決める
  var seed = 7;
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  function center(i) { var r = rooms[i]; return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; }
  var paths = players.map(function (_, pi) {
    var route = [3], cur = 3;
    for (var k = 0; k < 12; k++) {
      var nb = halls.filter(function (h) { return h[0] === cur || h[1] === cur; }).map(function (h) { return h[0] === cur ? h[1] : h[0]; });
      cur = nb[Math.floor(rnd() * nb.length)];
      route.push(cur);
    }
    return route.map(function (ri) {
      var c = center(ri), r = rooms[ri];
      return { x: c.x + (rnd() - .5) * r.w * .6, y: c.y + (rnd() - .5) * r.h * .5 };
    });
  });
  function deathTime(pi) { for (var i = 0; i < events.length; i++) if (events[i].kill === pi) return events[i].t; return Infinity; }
  function pos(pi, t) {
    var p = paths[pi], seg = 30, dt = Math.min(t, deathTime(pi));
    var i = Math.min(Math.floor(dt / seg), p.length - 2), f = Math.min(1, (dt - i * seg) / seg);
    return { x: p[i].x + (p[i + 1].x - p[i].x) * f, y: p[i].y + (p[i + 1].y - p[i].y) * f };
  }

  // ---- 描画 ----
  var cv = document.getElementById('map'), g = cv.getContext('2d');
  var slider = document.getElementById('t'), timeEl = document.getElementById('time');
  function draw(t) {
    g.clearRect(0, 0, cv.width, cv.height);
    g.strokeStyle = '#3a3f78'; g.lineWidth = 26; g.lineCap = 'round';
    halls.forEach(function (h) { var a = center(h[0]), b = center(h[1]); g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); });
    rooms.forEach(function (r) {
      g.fillStyle = '#262a52'; g.strokeStyle = '#4a4f8c'; g.lineWidth = 2;
      g.beginPath(); g.roundRect ? g.roundRect(r.x, r.y, r.w, r.h, 14) : g.rect(r.x, r.y, r.w, r.h); g.fill(); g.stroke();
      g.fillStyle = '#9fa3c9'; g.font = '15px sans-serif'; g.fillText(r.n, r.x + 10, r.y + 22);
    });
    players.forEach(function (p, pi) {
      var q = pos(pi, t), dead = t >= deathTime(pi);
      g.globalAlpha = dead ? .55 : 1;
      g.fillStyle = p.c; g.strokeStyle = '#000'; g.lineWidth = 2;
      g.beginPath(); g.arc(q.x, q.y, 11, 0, Math.PI * 2); g.fill(); g.stroke();
      if (dead) { g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.moveTo(q.x - 7, q.y - 7); g.lineTo(q.x + 7, q.y + 7); g.moveTo(q.x + 7, q.y - 7); g.lineTo(q.x - 7, q.y + 7); g.stroke(); }
      g.globalAlpha = 1;
    });
    timeEl.textContent = Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
    document.querySelectorAll('#log div').forEach(function (d) { d.className = +d.dataset.t <= t ? 'on' : ''; });
    renderPlayers(t);
  }
  function renderPlayers(t) {
    document.getElementById('players').innerHTML = players.map(function (p, pi) {
      var dead = t >= deathTime(pi);
      return '<tr><td class="' + (dead ? 'dead' : '') + '"><span class="dot" style="background:' + p.c + '"></span>' + p.n + '</td>' +
        '<td class="role-' + p.r + '">' + (p.r === 'imp' ? 'インポスター' : 'クルー') + '</td></tr>';
    }).join('');
  }
  document.getElementById('log').innerHTML = events.map(function (e) {
    return '<div data-t="' + e.t + '">' + Math.floor(e.t / 60) + ':' + String(e.t % 60).padStart(2, '0') + '　' + e.s + '</div>';
  }).join('');
  document.querySelectorAll('#log div').forEach(function (d) { d.style.cursor = 'pointer'; d.onclick = function () { slider.value = d.dataset.t; draw(+d.dataset.t); }; });

  var playing = null;
  document.getElementById('play').onclick = function () {
    if (playing) { clearInterval(playing); playing = null; this.textContent = '▶ 再生'; return; }
    if (+slider.value >= +slider.max) slider.value = 0;
    this.textContent = '⏸ 停止';
    var btn = this;
    playing = setInterval(function () {
      slider.value = +slider.value + 1; draw(+slider.value);
      if (+slider.value >= +slider.max) { clearInterval(playing); playing = null; btn.textContent = '▶ 再生'; }
    }, 40);
  };
  slider.oninput = function () { draw(+slider.value); };
  draw(0);
})();
</script>
</body>
</html>
