<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoS 戦歴アーカイブ</title>
<meta name="description" content="Nebula on the Ship の戦歴リザルトをブラウザで見られるアーカイブです。">
<meta property="og:title" content="NoS 戦歴アーカイブ">
<meta property="og:description" content="Nebula on the Ship の戦歴リザルト（マップ再生つき）をブラウザで見られます。">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
  :root {
    --bg:#f4f4fa; --panel:#ffffff; --fg:#1b1d33; --sub:#5d6080; --line:#dcdcec;
    --accent:#4b52b8; --accent-soft:#e6e7fa; --hover:#f0f0fa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1024; --panel:#181a36; --fg:#e8e9f7; --sub:#a0a3c6; --line:#2f3260;
      --accent:#8c92ff; --accent-soft:#2a2d5e; --hover:#202348;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f1024; --panel:#181a36; --fg:#e8e9f7; --sub:#a0a3c6; --line:#2f3260;
    --accent:#8c92ff; --accent-soft:#2a2d5e; --hover:#202348;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI","Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0; white-space:nowrap; }
  header .count { color:var(--sub); font-size:12px; }
  .app { flex:1; display:flex; min-height:0; }
  aside { width:300px; flex-shrink:0; border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .search { padding:10px; border-bottom:1px solid var(--line); }
  .search input { width:100%; padding:7px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; }
  .list { overflow:auto; flex:1; padding:6px; }
  .day { font-size:12px; color:var(--sub); padding:10px 8px 4px; font-weight:bold; }
  .item { display:block; width:100%; text-align:left; border:none; background:none; color:inherit; font:inherit; padding:8px 10px; border-radius:7px; cursor:pointer; }
  .item:hover { background:var(--hover); }
  .item[aria-current="true"] { background:var(--accent-soft); }
  .item .t { font-weight:600; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .m { font-size:12px; color:var(--sub); }
  .tag { display:inline-block; font-size:11px; padding:0 6px; border-radius:4px; background:#7a6424; color:#fff3c8; margin-left:4px; vertical-align:1px; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .bar { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  .bar .title { font-weight:600; flex:1; min-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar .title small { color:var(--sub); font-weight:normal; margin-left:6px; }
  .btn { font:inherit; font-size:13px; padding:5px 12px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; text-decoration:none; white-space:nowrap; }
  .btn:hover { border-color:var(--accent); }
  .back { display:none; }
  iframe { flex:1; width:100%; border:0; background:#fff; }
  .empty { flex:1; display:flex; align-items:center; justify-content:center; color:var(--sub); padding:24px; text-align:center; }
  .note { padding:4px 12px 8px; color:var(--sub); font-size:12px; background:var(--panel); border-bottom:1px solid var(--line); }
  @media (max-width: 760px) {
    aside { width:100%; border-right:none; }
    .app.viewing aside { display:none; }
    .app:not(.viewing) main { display:none; }
    .back { display:inline-block; }
  }
</style>
</head>
<body>
<header>
  <h1>NoS 戦歴アーカイブ</h1>
  <span class="count" id="count"></span>
</header>
<div class="app" id="app">
  <aside>
    <div class="search"><input id="q" type="search" placeholder="試合を検索（タイトル・メモ・日付）"></div>
    <div class="list" id="list"></div>
  </aside>
  <main>
    <div class="bar" id="bar" hidden>
      <button class="btn back" id="back">← 一覧</button>
      <div class="title" id="title"></div>
      <a class="btn" id="open" target="_blank" rel="noopener">新しいタブで開く</a>
      <a class="btn" id="dl" download>ダウンロード</a>
      <button class="btn" id="copy">リンクをコピー</button>
    </div>
    <div class="note" id="note" hidden></div>
    <div class="empty" id="empty">左の一覧から試合を選んでください。</div>
    <iframe id="frame" title="戦歴リザルト" hidden></iframe>
  </main>
</div>
<script>
(function () {
  var listEl = document.getElementById('list'), app = document.getElementById('app');
  var frame = document.getElementById('frame'), empty = document.getElementById('empty');
  var bar = document.getElementById('bar'), noteEl = document.getElementById('note');
  var matches = [];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function sizeText(n) { return n ? (n / 1048576 >= 1 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB') : ''; }
  function current() { try { return decodeURIComponent(location.hash.slice(1)); } catch (_) { return ''; } }

  function render() {
    var q = document.getElementById('q').value.trim().toLowerCase();
    var cur = current();
    var shown = matches.filter(function (m) { return !q || (m.title + ' ' + (m.note || '') + ' ' + m.date + ' ' + m.file).toLowerCase().indexOf(q) >= 0; });
    var html = '', lastDay = null;
    shown.forEach(function (m) {
      var day = (m.date || '').slice(0, 10) || '日付なし';
      if (day !== lastDay) { html += '<div class="day">' + esc(day) + '</div>'; lastDay = day; }
      html += '<button class="item" data-file="' + esc(m.file) + '" aria-current="' + (m.file === cur) + '">' +
        '<span class="t">' + esc(m.title) + (m.sample ? '<span class="tag">サンプル</span>' : '') + '</span>' +
        '<span class="m">' + esc((m.date || '').slice(11)) + (m.note ? '　' + esc(m.note) : '') + '</span></button>';
    });
    listEl.innerHTML = html || '<div class="empty">' + (matches.length ? '見つかりませんでした。' : 'まだ試合がありません。') + '</div>';
    document.getElementById('count').textContent = matches.length + '試合';
  }

  function show() {
    var file = current();
    var m = matches.filter(function (x) { return x.file === file; })[0];
    render();
    if (!m) {
      frame.hidden = true; frame.removeAttribute('src'); bar.hidden = true; noteEl.hidden = true; empty.hidden = false;
      app.classList.remove('viewing');
      document.title = 'NoS 戦歴アーカイブ';
      return;
    }
    var url = 'matches/' + encodeURIComponent(m.file);
    if (frame.getAttribute('src') !== url) frame.setAttribute('src', url);
    frame.hidden = false; empty.hidden = true; bar.hidden = false;
    document.getElementById('title').innerHTML = esc(m.title) + '<small>' + esc(m.date) + (m.size ? '・' + sizeText(m.size) : '') + '</small>';
    document.getElementById('open').href = url;
    document.getElementById('dl').href = url;
    document.getElementById('dl').setAttribute('download', m.file);
    noteEl.hidden = !m.note; noteEl.textContent = m.note || '';
    app.classList.add('viewing');
    document.title = m.title + ' | NoS 戦歴アーカイブ';
  }

  listEl.addEventListener('click', function (e) {
    var b = e.target.closest('.item');
    if (b) location.hash = encodeURIComponent(b.getAttribute('data-file'));
  });
  document.getElementById('q').addEventListener('input', render);
  document.getElementById('back').addEventListener('click', function () { history.pushState(null, '', location.pathname + location.search); show(); });
  document.getElementById('copy').addEventListener('click', function () {
    var btn = this, text = location.href;
    var done = function () { btn.textContent = 'コピーしました'; setTimeout(function () { btn.textContent = 'リンクをコピー'; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { prompt('このリンクをコピーしてください', text); });
    else prompt('このリンクをコピーしてください', text);
  });
  window.addEventListener('hashchange', show);

  fetch('matches/matches.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { matches = d.matches || []; show(); })
    .catch(function () { listEl.innerHTML = '<div class="empty">試合一覧（matches/matches.json）を読み込めませんでした。</div>'; });
})();
</script>
</body>
</html>
